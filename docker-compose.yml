services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: queryzen-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: "QueryZen#2026"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'SELECT 1 FROM dual;' | sqlplus -s system/$$ORACLE_PASSWORD@//localhost:1521/FREEPDB1 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  oracle-data: